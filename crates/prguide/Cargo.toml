[package]
name = "prguide"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "prguide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
fd-lock = "4"
ulid = "3"
toml = "1"
tempfile = "3"
serde-saphyr = "~2.0"
pulldown-cmark = "0.13"
mmdflux = { version = "=2.6.1", default-features = false }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
